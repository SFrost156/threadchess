<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreadChess - Ajedrez Online</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 5px; }
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .login-box h2 { margin-bottom: 25px; color: #1e3c72; text-align: center; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1e3c72;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            width: 100%;
        }
        .button-group { display: flex; gap: 10px; }
        .error { background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .error.show { display: block; }
        .room-screen { display: none; }
        .game-screen { display: none; }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0;
            background: white;
            border: 3px solid #333;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin: 20px 0;
            max-width: 500px;
        }
        .square {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: move;
            user-select: none;
            border: 2px solid transparent;
        }
        .square.light { background-color: #f0d9b5; }
        .square.dark { background-color: #b58863; }
        .square.selected { background-color: #baca44; }
        .square.legal-move::after {
            content: '';
            width: 15px;
            height: 15px;
            background-color: rgba(186, 202, 68, 0.7);
            border-radius: 50%;
        }
        .game-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-section {
            flex: 0 1 300px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>♔ ThreadChess ♔</h1>
            <p>Ajedrez Online Multiplayer</p>
            <small>Andrés Felipe Gómez Gutiérrez, Brayan David Roa Vega, Sebastián David Tojuelo Perilla</small>
        </div>

        <!-- Login Screen -->
        <div class="login-screen" id="loginScreen">
            <div class="login-box">
                <h2>Bienvenido a ThreadChess</h2>
                <div class="error" id="errorMessage"></div>
                <div class="form-group">
                    <label for="playerName">Tu nombre:</label>
                    <input type="text" id="playerName" placeholder="Ej: Juan Pérez" maxlength="20">
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="createRoom()">Crear Sala</button>
                    <button class="btn-secondary" onclick="toggleJoinMode()">Unirse</button>
                </div>
                <div id="joinMode" style="display: none; margin-top: 20px;">
                    <div class="form-group">
                        <label for="roomCode">Código de sala:</label>
                        <input type="text" id="roomCode" placeholder="Ej: ABC123" maxlength="6">
                    </div>
                    <button class="btn-primary" onclick="joinRoom()">Unirse a Sala</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <div style="text-align: center; margin-bottom: 20px;">
                <button class="btn-secondary" onclick="goBack()" style="max-width: 200px;">Salir del Juego</button>
            </div>
            
            <div class="game-container">
                <div>
                    <div class="board" id="board"></div>
                </div>
                <div class="info-section">
                    <h3>Estado del Juego</h3>
                    <div style="margin: 20px 0;">
                        <div style="background: #f5f5f5; padding: 10px; border-radius: 5px; margin-bottom: 10px;">
                            <strong>Blancas:</strong> <span id="whiteName">-</span>
                        </div>
                        <div style="background: #f5f5f5; padding: 10px; border-radius: 5px;">
                            <strong>Negras:</strong> <span id="blackName">-</span>
                        </div>
                    </div>
                    <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; margin: 20px 0;">
                        <strong id="gameStatus">Conectando...</strong>
                    </div>
                    <div style="max-height: 150px; overflow-y: auto;">
                        <strong>Movimientos:</strong>
                        <div id="movesList" style="font-size: 0.9em; margin-top: 10px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PIECES = {
            'P': '♙', 'N': '♘', 'B': '♗', 'R': '♖', 'Q': '♕', 'K': '♔',
            'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚'
        };

        let socket = null;
        let playerName = null;
        let roomId = null;
        let gameState = null;
        let selectedSquare = null;
        let legalMoves = [];
        let myColor = null;

        socket = io();

        socket.on('room_created', (data) => {
            roomId = data.room_id;
            playerName = data.player_name;
            showGameScreen();
            document.getElementById('gameStatus').textContent = `Esperando otro jugador... (Código: ${roomId})`;
        });

        socket.on('game_started', (data) => {
            gameState = data.state;
            determineMyColor();
            updateBoard();
            updateGameInfo();
        });

        socket.on('move_made', (data) => {
            gameState = data.state;
            updateBoard();
            updateGameInfo();
            selectedSquare = null;
            legalMoves = [];
        });

        socket.on('legal_moves', (data) => {
            legalMoves = data.moves;
            highlightLegalMoves();
        });

        socket.on('error', (data) => {
            showError(data.message);
        });

        socket.on('player_left', (data) => {
            showError(data.message);
            setTimeout(goBack, 2000);
        });

        function createRoom() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) {
                showError('Por favor ingresa tu nombre');
                return;
            }
            playerName = name;
            socket.emit('create_room', { player_name: name });
        }

        function toggleJoinMode() {
            const joinMode = document.getElementById('joinMode');
            joinMode.style.display = joinMode.style.display === 'none' ? 'block' : 'none';
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value.trim();
            const code = document.getElementById('roomCode').value.toUpperCase().trim();

            if (!name) {
                showError('Por favor ingresa tu nombre');
                return;
            }
            if (!code) {
                showError('Por favor ingresa el código de sala');
                return;
            }

            playerName = name;
            roomId = code;
            socket.emit('join_room', { room_id: code, player_name: name });
            showGameScreen();
            document.getElementById('gameStatus').textContent = 'Conectando...';
        }

        function showGameScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
        }

        function goBack() {
            socket.disconnect();
            location.reload();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 4000);
        }

        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const squareIndex = row * 8 + col;
                    const square = document.createElement('div');
                    square.className = 'square';
                    square.className += (row + col) % 2 === 0 ? ' light' : ' dark';
                    square.id = `square-${squareIndex}`;
                    square.onclick = () => handleSquareClick(squareIndex);
                    board.appendChild(square);
                }
            }
        }

        function updateBoard() {
            if (!gameState) return;

            createBoard();

            const fen = gameState.fen;
            const fenRows = fen.split(' ')[0].split('/');

            let squareIndex = 0;
            fenRows.forEach((row) => {
                for (let char of row) {
                    if (isNaN(char)) {
                        const square = document.getElementById(`square-${squareIndex}`);
                        const piece = document.createElement('div');
                        piece.style.fontSize = '1.4em';
                        piece.textContent = PIECES[char];
                        square.appendChild(piece);
                        squareIndex++;
                    } else {
                        squareIndex += parseInt(char);
                    }
                }
            });
        }

        function handleSquareClick(squareIndex) {
            if (!gameState || gameState.game_over) return;

            const currentSquare = document.getElementById(`square-${squareIndex}`);
            const piece = currentSquare.querySelector('div');

            if (selectedSquare === null) {
                if (!piece) return;
                selectedSquare = squareIndex;
                currentSquare.classList.add('selected');
                socket.emit('get_legal_moves', { square: squareIndex });
            } else {
                if (selectedSquare === squareIndex) {
                    deselect();
                    return;
                }

                const moveUci = indexToSquareUci(selectedSquare) + indexToSquareUci(squareIndex);
                
                if (legalMoves.includes(moveUci)) {
                    socket.emit('move', { move: moveUci });
                    deselect();
                } else {
                    deselect();
                    handleSquareClick(squareIndex);
                }
            }
        }

        function deselect() {
            if (selectedSquare !== null) {
                document.getElementById(`square-${selectedSquare}`).classList.remove('selected');
            }
            selectedSquare = null;
            legalMoves = [];
            document.querySelectorAll('.square').forEach(sq => sq.classList.remove('legal-move'));
        }

        function highlightLegalMoves() {
            document.querySelectorAll('.square').forEach(sq => sq.classList.remove('legal-move'));
            legalMoves.forEach(move => {
                const toSquare = move.substring(2, 4);
                const squareIndex = squareUciToIndex(toSquare);
                document.getElementById(`square-${squareIndex}`).classList.add('legal-move');
            });
        }

        function updateGameInfo() {
            if (!gameState) return;

            document.getElementById('whiteName').textContent = gameState.white_player || '-';
            document.getElementById('blackName').textContent = gameState.black_player || '-';

            let statusText = gameState.current_turn === 'white' ? 'Turno: Blancas ♔' : 'Turno: Negras ♟';
            if (gameState.game_over) {
                if (gameState.result === 'checkmate') {
                    statusText = gameState.current_turn === 'white' ? '¡Negras ganan!' : '¡Blancas ganan!';
                } else {
                    statusText = 'Empate';
                }
            }

            document.getElementById('gameStatus').textContent = statusText;

            const movesList = document.getElementById('movesList');
            movesList.innerHTML = '';
            gameState.move_history.forEach((move, index) => {
                const moveItem = document.createElement('div');
                moveItem.style.paddingBottom = '5px';
                moveItem.textContent = `${Math.floor(index / 2) + 1}. ${move}`;
                movesList.appendChild(moveItem);
            });
        }

        function determineMyColor() {
            if (!gameState) return;
            myColor = gameState.white_player === playerName ? 'white' : 'black';
        }

        function squareUciToIndex(uci) {
            const file = uci.charCodeAt(0) - 97;
            const rank = 8 - parseInt(uci[1]);
            return rank * 8 + file;
        }

        function indexToSquareUci(index) {
            const row = Math.floor(index / 8);
            const col = index % 8;
            return String.fromCharCode(97 + col) + (8 - row);
        }

        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createRoom();
        });
        document.getElementById('roomCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });
    </script>
</body>
</html>
